[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fi4-monitor"
version = "0.1.0"
description = "Portable Segotep FI4 CPU telemetry monitor for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hidapi>=0.14.0",
    "psutil>=5.9.0",
    "pythonnet>=3.0.3",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
]

[project.scripts]
fi4-monitor = "fi4_monitor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
